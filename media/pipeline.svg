<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9a441"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="18" fill="#fdfcf9" stroke="#d6d0c4"/>

  <!-- 1. Prompt -->
  <g transform="translate(30,40)">
    <rect width="140" height="120" rx="14" fill="#1e3a6e"/>
    <rect x="22" y="28" width="96" height="26" rx="8" fill="none" stroke="#efe7d6" stroke-width="2"/>
    <text x="34" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#efe7d6">una casa…</text>
    <text x="70" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#efe7d6">Prompt</text>
    <text x="70" y="107" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d9a441">o una imagen</text>
  </g>

  <!-- 2. LLM -->
  <g transform="translate(205,40)">
    <rect width="140" height="120" rx="14" fill="#1e3a6e"/>
    <g fill="none" stroke="#efe7d6" stroke-width="1.6">
      <rect x="28" y="20" width="36" height="36" rx="4"/>
      <rect x="76" y="20" width="36" height="36" rx="4"/>
      <path d="M34 48 L46 32 L58 48 Z"/>
      <circle cx="94" cy="38" r="10"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#efe7d6">LLM</text>
    <text x="70" y="107" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d9a441">4 bocetos SVG</text>
  </g>

  <!-- 3. Web -->
  <g transform="translate(380,40)">
    <rect width="140" height="120" rx="14" fill="#1e3a6e"/>
    <g fill="none" stroke="#efe7d6" stroke-width="1.6">
      <rect x="34" y="18" width="72" height="44" rx="4"/>
      <path d="M52 50 L52 38 L60 30 L68 38 L68 50 Z"/>
      <circle cx="94" cy="28" r="4" fill="#d9a441" stroke="none"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#efe7d6">Web</text>
    <text x="70" y="107" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d9a441">eliges dibujo y colores</text>
  </g>

  <!-- 4. Servidor -->
  <g transform="translate(555,40)">
    <rect width="140" height="120" rx="14" fill="#1e3a6e"/>
    <g fill="none" stroke="#efe7d6" stroke-width="1.6">
      <path d="M30 50 C42 24, 56 56, 70 32 S98 44, 110 26"/>
      <circle cx="30" cy="50" r="3" fill="#efe7d6"/>
      <circle cx="110" cy="26" r="3" fill="#efe7d6"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#efe7d6">Trazos</text>
    <text x="70" y="107" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d9a441">mm → ángulos, 100 Hz</text>
  </g>

  <!-- 5. Brazo -->
  <g transform="translate(730,40)">
    <rect width="140" height="120" rx="14" fill="#d9a441"/>
    <g fill="none" stroke="#1e3a6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="30" y1="62" x2="62" y2="62"/>
      <path d="M46 62 L46 52 L66 28 L94 34 L100 52"/>
      <circle cx="66" cy="28" r="4"/>
      <line x1="100" y1="52" x2="100" y2="60"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#1e3a6e">SO-101</text>
    <text x="70" y="107" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a6e">dibuja en el folio</text>
  </g>

  <!-- flechas -->
  <g stroke="#d9a441" stroke-width="2.4" marker-end="url(#flecha)">
    <line x1="173" y1="100" x2="200" y2="100"/>
    <line x1="348" y1="100" x2="375" y2="100"/>
    <line x1="523" y1="100" x2="550" y2="100"/>
    <line x1="698" y1="100" x2="725" y2="100"/>
  </g>

  <!-- quién -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6c665d" text-anchor="middle">
    <line x1="30" y1="192" x2="520" y2="192" stroke="#1e3a6e" stroke-width="2"/>
    <text x="275" y="215">Íñigo · web y conexión con el brazo</text>
    <line x1="555" y1="192" x2="695" y2="192" stroke="#1e3a6e" stroke-width="2"/>
    <text x="625" y="215">Alfred · software</text>
    <line x1="730" y1="192" x2="870" y2="192" stroke="#d9a441" stroke-width="2"/>
    <text x="800" y="215">Alfred · calibración</text>
    <text x="800" y="233">Ander · cabezal</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
